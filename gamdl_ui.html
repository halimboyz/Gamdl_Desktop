<title>GAMDL</title>
<style>
html,body{margin:0;padding:0;border:0;width:100%;height:100%;overflow:hidden;color-scheme:dark;background:#1c1c1c;color:#dcdcdc;
  font-family:"Segoe UI Variable Text","Segoe UI",Inter,Arial,sans-serif;font-size:14px;line-height:1.3;
  -ms-user-select:none;user-select:none;cursor:default}
*{box-sizing:border-box}
input,textarea,select{font-family:inherit;-ms-user-select:text;user-select:text}

/* ---------- rail ---------- */
#rail{position:absolute;left:0;top:32px;bottom:0;width:50px;background:#1f2022;z-index:30;overflow:hidden}

body.wide #top{left:220px}

body.wide .rb span.lb{display:block}
.rb:hover{background:#2a2a2c;color:#fff}
.rb.on{background:#2d2d2f;color:#fff}
.rb.on:before{content:"";position:absolute;left:0;top:12px;width:3px;height:16px;border-radius:2px;background:#0091ff}
.rb .bd{position:absolute;left:24px;top:3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#0091ff;color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;display:none}
#rtop{height:44px;margin-top:0}

/* ---------- bottom dock ---------- */

.dock{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:40px;background:rgba(20,20,24,.55);border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(28px) saturate(140%);-webkit-backdrop-filter:blur(28px) saturate(140%)}
.tb{position:relative;width:36px;height:36px;border-radius:18px;color:#dcdcdc;cursor:pointer;flex:0 0 auto}
.tb svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}

#wslot{position:relative;height:52px;width:360px;max-width:calc(100% - 364px);min-width:180px;flex:0 1 auto}
#wdg{position:relative;max-width:360px;min-width:120px;margin:0;height:52px;background:#303030;border-radius:8px;overflow:hidden;cursor:pointer}
#wart{position:absolute;left:0;top:0;width:54px;height:52px;background-color:#3a3a3a;background-size:cover;background-position:center}
#wtxt{position:absolute;left:62px;right:46px;top:8px;text-align:center}
#wt1{font-size:13px;font-weight:700;color:#e0e0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wt2{font-size:12.5px;color:#9b9b9b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#wmore{position:absolute;right:8px;top:6px;color:#9b9b9b;font-size:12px;font-weight:600}
#wbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#666}
#wbar i{display:block;height:3px;width:0;background:#ddd}
#wbar{overflow:hidden}
#wbar.ld i{width:30%!important;animation:ldslide 1.1s ease-in-out infinite}
@keyframes ldslide{0%{margin-left:-30%}100%{margin-left:100%}}

/* ---------- main ---------- */
#main{position:absolute;left:50px;top:32px;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;background:#1c1c1c;-ms-overflow-style:-ms-autohiding-scrollbar}
.pg{padding:30px 40px 140px}

.clr{clear:both;height:0;overflow:hidden}

/* ---------- cards ---------- */
.cards{margin-right:-20px;font-size:0}
.card{display:inline-block;vertical-align:top;margin:0 20px 26px 0;cursor:pointer;position:relative;font-size:14px}
.cv{position:relative;width:100%;height:0;padding-top:100%;background-color:#2a2a2c;background-size:cover;background-position:center;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.cv .ov{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,0);transition:background .2s}

.hb svg{position:absolute;left:6px;top:6px;width:20px;height:20px}
.hb:hover{background:rgba(110,110,110,.95)}
.hb.l{left:8px}.hb.r{right:8px}
.card:hover .hb{opacity:1}
.card.sel .cv{border:2px solid #0091ff}
.ck{position:absolute;left:8px;top:8px;width:24px;height:24px;border-radius:12px;background:#0091ff;color:#fff;display:none}
.ck svg{position:absolute;left:4px;top:4px;width:16px;height:16px;stroke-width:2.6}
.card.sel .ck{display:block}
.t1{margin-top:9px;font-size:14.5px;color:#dcdcdc;line-height:1.25;max-height:36px;overflow:hidden}
.t2{margin-top:2px;font-size:14px;color:#939292;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex{display:inline-block;width:14px;height:14px;border-radius:3.5px;background:#8e8e93;color:#1c1c1e;font-size:10px;font-weight:800;line-height:14px;text-align:center;vertical-align:1px;margin-left:5px}

/* big cards on Home */
.big{display:inline-block;vertical-align:top;font-size:14px;margin:0 20px 20px 0;height:340px;border-radius:10px;overflow:hidden;position:relative;cursor:pointer;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.08)}
.big .bl{position:absolute;left:16px;right:16px;bottom:16px}
.big .b1{font-size:12px;font-weight:600;color:rgba(255,255,255,.7)}

.big .bi{position:absolute;left:0;right:0;top:70px;text-align:center;color:rgba(255,255,255,.9)}
.big .bi svg{width:110px;height:110px;margin:0 auto;stroke-width:1.2}

/* mac-style window bar: the strip drags the window, the three lights are real buttons (AHK removes the Windows caption) */
#tbar{position:fixed;left:0;top:0;right:0;height:32px;background:rgba(12,12,14,.45);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);z-index:50;-webkit-app-region:drag}
#tbt{position:absolute;left:90px;right:90px;top:0;text-align:center;color:#fff;font:700 13px/32px "SFLyric","SF Pro Display",-apple-system,"Segoe UI",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#tl{position:fixed;left:14px;top:10px;display:flex;gap:8px;z-index:9999;-webkit-app-region:no-drag}
#tl div{position:relative;width:12px;height:12px;border-radius:50%;cursor:default}
#tl div:nth-child(1){background:#ff5f57}#tl div:nth-child(2){background:#febc2e}#tl div:nth-child(3){background:#28c840}
#tl svg{position:absolute;left:2px;top:2px;width:8px;height:8px;opacity:0;stroke:rgba(0,0,0,.6);stroke-width:1.5;stroke-linecap:round;fill:none}
#tl:hover svg{opacity:1}
#lcl{-webkit-app-region:no-drag}

/* artist circles */
.acard{display:inline-block;vertical-align:top;font-size:14px;margin:0 20px 22px 0;text-align:center;cursor:pointer}
.av{margin:0 auto;border-radius:50%;color:#fff;font-weight:700;text-align:center;overflow:hidden;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.1)}
.acard .t1{text-align:center;margin-top:10px;max-height:20px}

/* ---------- artist page ---------- */
body.dark #main{background:#070709}
#hero{position:relative;height:560px;overflow:hidden}
/* artist backdrop: pinned behind the page; JS sets --bl (blur) and --pl (plain-colour cover) from the scroll position */
#hbg{display:none;position:sticky;top:0;height:560px;margin-bottom:-560px;overflow:hidden;pointer-events:none;background:#070709}
body.dark #hbg{display:block}
body.dark #view{position:relative}
#hbg .hbm{position:absolute;left:0;top:0;right:0;bottom:0;filter:blur(var(--bl,0px));transform:scale(1.08) translateZ(0)}
#hbg .hi{position:absolute;left:0;top:0;right:0;bottom:0;background-size:cover;background-position:center 20%}
#hbg.sq .hi{filter:blur(22px);transform:scale(1.1)}
#hbg video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:0;transition:opacity .8s ease}
#hbg video.on{opacity:1}
#hbg .hg{position:absolute;left:0;top:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(7,7,9,0) 30%,rgba(7,7,9,.55) 62%,rgba(7,7,9,.9) 86%,#070709)}
#hbg .hpl{position:absolute;left:0;top:0;right:0;bottom:0;background:#070709;opacity:var(--pl,0)}
#hbg.off .hbm{visibility:hidden}
#hero .hlogow{position:absolute;left:22px;top:18px;z-index:3;display:inline-block;line-height:0;pointer-events:none;transform-origin:left center;animation:hlogoPop 1.1s cubic-bezier(.22,.9,.3,1) both;will-change:transform,filter,opacity}
#hero .hlogo{display:block;height:46px;width:auto;-webkit-user-drag:none;user-select:none;transform-origin:left center;animation:hlogoFocus 6s ease-in-out 1.4s infinite,hlogoGlow 3.4s ease-in-out 1.4s infinite}
/* the page re-renders while data loads: replay the entrance only the first time for an artist */
#hero .hlogow.nointro{animation:none}
#hero .hlogow.nointro .hlogo{animation-delay:0s}
/* blur-only: blur + fade + small scale, no rotation */
@keyframes hlogoPop{0%{opacity:0;filter:blur(22px);transform:scale(1.35)}60%{opacity:1;filter:blur(5px);transform:scale(.98)}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes hlogoFocus{0%,82%,100%{filter:blur(0);transform:scale(1)}91%{filter:blur(3.5px);transform:scale(1.06)}}
@keyframes hlogoGlow{0%,100%{opacity:.95}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#hero .hlogow,#hero .hlogo{animation:none}}
#hero .hn{position:absolute;left:0;right:0;bottom:102px;text-align:center;font-size:46px;font-weight:800;color:#fff;letter-spacing:-.6px;text-shadow:0 4px 24px rgba(0,0,0,.6);transform:translateZ(0);will-change:transform,opacity}
#hero .hn.hl{height:0;bottom:125px;display:flex;align-items:center;justify-content:center}
#hero .hnl{flex:none;width:min(300px,60%);height:auto;filter:drop-shadow(0 4px 18px rgba(0,0,0,.55))}
#hero .hs{position:absolute;left:0;right:0;bottom:4px;height:76px;text-align:center;transform:translateZ(0);will-change:transform,opacity}
.hc{display:inline-block;vertical-align:middle;width:48px;height:48px;border-radius:24px;background:rgba(120,120,120,.38);color:#e8e8e8;margin:0 10px;position:relative;cursor:pointer}
.hc svg{position:absolute;left:12px;top:12px}
.hc:hover{background:rgba(150,150,150,.5)}
.hc.big2{width:76px;height:76px;border-radius:38px;background:#fff;color:#111}
.hc.big2 svg{left:19px;top:19px;width:38px;height:38px}
.hc.big2:hover{background:#e8e8e8}
.hc.fav{color:#ff375f}
.cols2{margin-right:-30px}
.cols2 .col{float:left;width:50%;padding-right:30px}
.hl{padding:2px 0}
.lr{position:relative;height:53px;border-bottom:1px solid #1d1d1f;cursor:pointer}
.lr .th{position:absolute;left:0;top:7px;width:40px;height:40px;border-radius:4px;background-size:cover;background-color:#2a2a2c}
.lr .rt{position:absolute;left:50px;top:8px;right:50px;font-size:14.5px;color:#e0e0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.latest{position:relative;height:165px}
.latest .lc{position:absolute;left:0;top:0;width:160px;height:160px;border-radius:8px;background-size:cover;background-color:#2a2a2c;border:1px solid rgba(255,255,255,.1);cursor:pointer}

.latest .l1{font-size:12px;font-weight:600;color:#939292}
.latest .l2{font-size:16px;font-weight:600;color:#e4e4e4;margin-top:4px}
.latest .l3{font-size:15px;color:#939292;margin-top:2px}

/* ---------- album / playlist page ---------- */
.ahead{position:relative;height:290px}
.ahead .cover{position:absolute;left:0;top:6px;width:270px;height:270px;border-radius:10px;background-size:cover;background-color:#2a2a2c;box-shadow:0 12px 40px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.08);animation:albumCoverZoom 0.9s cubic-bezier(.22,.9,.3,1) both;transform:translateZ(0);will-change:transform,opacity}
.ahead .info{position:absolute;left:303px;top:34px;right:0;animation:albumTitleSlide 0.85s cubic-bezier(.22,.9,.3,1) both;transform:translateZ(0);will-change:transform,opacity}
.ahead .an{font-size:28px;font-weight:700;color:#e8e8e8;line-height:1.15;max-height:66px;overflow:hidden}

.pill{display:inline-block;height:36px;line-height:36px;padding:0 22px 0 16px;border-radius:18px;background:#2f2f2f;color:#ddd;font-size:15px;font-weight:600;cursor:pointer;margin-right:10px;vertical-align:top;white-space:nowrap}

.pill.sm{height:32px;line-height:32px;font-size:14px;padding:0 16px}
.cbtn{display:inline-block;width:36px;height:36px;border-radius:18px;background:#2f2f2f;color:#ddd;position:relative;margin-right:10px;vertical-align:top;cursor:pointer}
.cbtn svg{position:absolute;left:7px;top:7px}
.cbtn:hover{background:#3b3b3b;color:#fff}
.cbtn.on{color:#0091ff}
.tbl{margin-top:6px}
.th0{position:relative;height:34px;border-bottom:1px solid #2f2f2f;font-size:13px;font-weight:700;color:#939292}
.tr{position:relative;height:53px;border-bottom:1px solid #2f2f2f;cursor:pointer}
.tr:hover{background:rgba(255,255,255,.045)}
.tr.sel{background:rgba(0,145,255,.18)}
.tr .c{position:absolute;top:0;line-height:53px;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#939292}
.th0 .c{position:absolute;top:0;line-height:34px}
.tr .c.m{color:#dcdcdc}
.tr .tn{position:absolute;left:0;top:0;width:40px;line-height:53px;text-align:center;color:#939292}
.tr .tnb{position:absolute;left:8px;top:14px;width:24px;height:24px;border-radius:12px;background:#0091ff;color:#fff;display:none}

/* ---------- toolbar / inputs ---------- */
.tools{margin:-8px 0 22px;height:36px;position:relative}
.inp{height:34px;border:0;border-radius:7px;background:#2b2b2d;color:#e4e4e4;padding:0 12px;font-size:14px;outline:none}

#lbg{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none;background:#0b0b0f}
#lbg i{position:absolute;border-radius:50%;background-image:var(--art);background-size:cover;background-position:center;
  filter:blur(70px) saturate(1.9) brightness(.82);opacity:.8;will-change:transform;transition:opacity .8s}
#lbg .o1{width:95vmax;height:95vmax;left:-38vmax;top:-34vmax;animation:lbgA 52s linear infinite}
#lbg .o2{width:85vmax;height:85vmax;right:-40vmax;bottom:-46vmax;animation:lbgB 68s linear infinite;opacity:.7}
#lbg .o3{width:50vmax;height:50vmax;left:30%;top:20%;animation:lbgA 80s linear infinite reverse;opacity:.45}
#lbg:after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background:linear-gradient(90deg,rgba(6,6,10,.34),rgba(6,6,10,.18) 55%,rgba(6,6,10,.3))}
@keyframes lbgA{to{transform:rotate(360deg)}}
@keyframes lbgB{to{transform:rotate(-360deg)}}
#lcl{position:absolute;right:22px;top:44px;width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;z-index:5;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#lcl:hover{background:rgba(255,255,255,.22)}
#lcl svg{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%)}

#lleft{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;padding:30px 20px 118px 52px;min-width:0}
#lart{position:relative;width:100%;max-width:min(400px,44vh);aspect-ratio:1/1;margin:0 auto 24px;border-radius:14px;background-size:cover;background-position:center;background-color:#26262a;
  box-shadow:0 34px 80px rgba(0,0,0,.6);transform:scale(.84);transition:transform .7s cubic-bezier(.22,.9,.3,1)}
#lart svg{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;color:rgba(255,255,255,.3);stroke-width:1.2}
#lyrics.pl #lart{transform:scale(1)}
#lart{overflow:hidden}
#lart video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:2;pointer-events:none;opacity:0;transition:opacity .7s;border-radius:inherit}
#lart video.on{opacity:1}
#lmeta{max-width:min(400px,44vh);width:100%;margin:0 auto}
#lt1{font-size:22px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
#lt2{font-size:16px;color:rgba(255,255,255,.62);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lseek{position:relative;height:36px;margin:14px auto 0;max-width:min(400px,44vh);width:100%;cursor:pointer}
#lsbar{position:absolute;left:0;right:0;top:10px;height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;transition:top .15s,height .15s}
#lseek:hover #lsbar{top:9px;height:8px}
#lsfill{display:block;height:100%;width:0;border-radius:3px;background:rgba(255,255,255,.92)}
#lsc,#lsd{position:absolute;top:21px;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}
#lsc{left:0}#lsd{right:0}
#lctl{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px auto 0;max-width:min(400px,44vh);width:100%}
.lbn{position:relative;flex:0 0 auto;width:46px;height:46px;border-radius:23px;color:rgba(255,255,255,.86);cursor:pointer;transition:background .15s,transform .15s,color .15s}
.lbn svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.lbn:hover{background:rgba(255,255,255,.14);color:#fff}
.lbn:active{transform:scale(.92)}
.lbn.on{color:#0091ff}
.lbn.pbig{width:64px;height:64px;border-radius:32px;background:rgba(255,255,255,.16);color:#fff}
.lbn.pbig svg{width:30px;height:30px}
.lbn.sm{width:36px;height:36px;border-radius:18px}
.lbn.sm svg{width:20px;height:20px}
#lbtm{display:flex;align-items:center;gap:10px;margin:10px auto 0;max-width:min(400px,44vh);width:100%}
#lvol{position:relative;flex:1;height:30px;cursor:pointer}
#lvb{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
#lvf{display:block;height:100%;width:0;background:rgba(255,255,255,.9)}
.tb:hover,.lbn:hover{background:rgba(255,255,255,.12)}
.tb.on,.lbn.on{background:rgba(0,145,255,.18);color:#2ba3ff}
#b_play,.lbn.pbig{background:rgba(255,255,255,.14)} #b_play:hover,.lbn.pbig:hover{background:rgba(255,255,255,.22)}
.tb:active,.lbn:active{background:rgba(255,255,255,.2);transform:scale(.9)}
#lnote{max-width:min(400px,44vh);margin:8px auto 0;font-size:12.5px;line-height:1.4;color:rgba(255,255,255,.5);text-align:center;min-height:17px}

#lbody{position:relative;z-index:2;height:100%;overflow:hidden;
  -webkit-mask-image:linear-gradient(transparent 0,#000 11%,#000 78%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 11%,#000 78%,transparent 100%)}
#lbody.plain{overflow-y:auto}
#lscroll{position:absolute;left:0;right:0;top:0;padding:0 64px 0 18px}
#lbody.plain #lscroll{position:relative;padding:60px 64px 220px 18px}

.ly{display:block;position:relative;font-family:"SFLyric","Segoe UI Variable Text","Segoe UI",Inter,Arial,sans-serif;font-size:clamp(26px,3.05vw,46px);font-weight:800;line-height:1.2;letter-spacing:-.5px;color:#fff;
  padding:12px 20px;margin:1px 0;border-radius:16px;opacity:.34;cursor:pointer;transform-origin:left center;will-change:transform,filter,opacity;
  transition:transform .55s cubic-bezier(.3,.9,.3,1.04),filter .4s ease,opacity .4s ease,background .2s ease}   /* Apple-like: quick glide with a hair of overshoot */
.ly:hover{background:rgba(255,255,255,.09)}
#lscroll.nt .ly{transition:none!important}
#lbody.scrolling .ly{filter:none!important;opacity:.66!important;transition-duration:.14s,.3s,.3s!important;transition-delay:0s!important}
#lbody.scrolling .ly.on{opacity:1!important}
.ly.plain{font-size:24px;font-weight:700;opacity:.86;cursor:default;padding:4px 20px;letter-spacing:0;line-height:1.35;transform:none!important;filter:none!important}
.ly.plain:hover{background:none}
.ly .lw{display:inline-block;white-space:pre-wrap;overflow-wrap:anywhere;padding:.12em .06em .3em;margin:-.12em -.06em -.3em}   /* pre-wrap: a whole phrase wraps instead of running out of the window. padding + equal negative margin: the gradient text fill gets room for descenders like g, layout unchanged */
.ly .lbg{display:block;font-size:.58em;font-weight:700;line-height:1.25;margin-top:.14em;letter-spacing:-.2px;opacity:.62}
.ly.on .lbg .lw{background-image:linear-gradient(90deg,rgba(255,255,255,.85) calc(var(--g,-10)*1% - 10%),rgba(255,255,255,.3) calc(var(--g,-10)*1% + 10%))}
.ly.on .lw{color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(90deg,#fff calc(var(--g,-10)*1% - 10%),rgba(255,255,255,.38) calc(var(--g,-10)*1% + 10%))}
.ly.gap{padding:18px 20px}
.ly.gap .dots{display:inline-flex;gap:11px;align-items:center;height:30px}
.ly.gap .dots i{display:block;width:15px;height:15px;border-radius:50%;background:#fff;opacity:.3;transform:scale(.8)}
.ly.gap.on .dots{animation:dotsBreathe 3.2s ease-in-out infinite}
@keyframes dotsBreathe{0%,100%{transform:scale(.94)}50%{transform:scale(1.14)}}
.lmsg{color:rgba(255,255,255,.55);font-size:16px;padding:46vh 40px 0;text-align:left;font-weight:600}
#lbody .spin{margin:42vh 40px 0;border-color:rgba(255,255,255,.2);border-top-color:#fff}
@media (max-width:940px){#lyrics{grid-template-columns:1fr}#lleft{display:none}#lscroll{padding-left:10px;padding-right:20px}}
@media (prefers-reduced-motion:reduce){#lbg i{animation:none!important}}

/* =====================================================================
   EQUALIZER PANEL
   ===================================================================== */
#eqp{position:fixed;left:50%;bottom:98px;width:min(740px,calc(100% - 40px));padding:14px 18px 12px;border-radius:24px;z-index:70;
  background:rgba(22,22,26,.8);border:1px solid rgba(255,255,255,.14);box-shadow:0 26px 80px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);
  opacity:0;pointer-events:none;transform:translate(-50%,18px) scale(.98);transition:opacity .2s ease,transform .32s cubic-bezier(.22,.9,.3,1)}
#eqp.on{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
#eqh{display:flex;align-items:center;gap:10px;height:36px}
#eqh .eqt{font-size:17px;font-weight:800;color:#fff;margin-right:2px}
#eqh .eqsp{flex:1}
#eqh .chip{margin:0}
#eqh .chip.on{background:#0091ff;color:#fff}
#eqh .eqx{position:relative;width:30px;height:30px;border-radius:15px;color:#bbb;cursor:pointer}
#eqh .eqx:hover{background:#3a3a3c;color:#fff}
#eqh .eqx svg{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}
#eqpre{margin:8px 0 6px;line-height:34px}
#eqpre .chip{margin:0 6px 0 0}

.eqb .t{position:absolute;left:0;right:0;top:24px;bottom:24px}

.eqb .z{position:absolute;left:28%;right:28%;top:50%;height:1px;background:rgba(255,255,255,.35)}

.eqb .k{position:absolute;left:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:9px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.55);transition:transform .12s}
.eqb:hover .k{transform:scale(1.18)}

/* ---------- smooth wheel scrolling for #main (IE11 friendly) ---------- */
(function(){
  var main = document.getElementById('main');
  if(!main) return;
  var raf = window.requestAnimationFrame || function(f){setTimeout(f,16)};
  var target = main.scrollTop, current = main.scrollTop, running = false;
  function loop(){
    var diff = target - current;
    if(Math.abs(diff) < 0.5){ running = false; return; }
    current += diff * 0.22;
    main.scrollTop = current;
    raf(loop);
  }
  /* smooth wheel scrolling disabled for performance
  main.addEventListener('wheel', function(e){
    target += e.deltaY;
    if(target < 0) target = 0;
    var max = main.scrollHeight - main.clientHeight;
    if(target > max) target = max;
    if(!running){ running = true; raf(loop); }
    e.preventDefault();
  }, {passive:false}); */
})();
</script>

    x.a.volume = x.g; x.a.pause(); x.a.currentTime = 0;

/* ---------------- queue actions ---------------- */
function addIt(it, now, quiet){
  if(!it || !it.url) return 0;
  var art = artw(it.art, 300);
  send('add', it.kind, it.name, it.artist || '', it.url, art);
  return 1;
}
function addMany(list, now, label){
  var n=0; each(list, function(it){ n += addIt(it); });
  if(now) send('start');
  toast((now?'Downloading ':'Added ')+n+' '+(label||'item')+(n===1?'':'s')+(now?'':' to the queue'));
}

/* ---------------- layout ---------------- */
function calc(){
  var w = $('main').clientWidth - 80; if(w<300) w=300; S.cw = w;
  var cols = Math.floor((w+20)/(190+20)); if(cols<2) cols=2; if(cols>8) cols=8;
  S.cols = cols; S.W = Math.floor((w-20*(cols-1))/cols);
  S.bigCols = Math.max(2, Math.floor((w+20)/(236+20))); S.bigW = Math.floor((w-20*(S.bigCols-1))/S.bigCols);
}
function selUpdate(){
  S.selN = keys(S.sel).length;
  $('seln').innerHTML = S.selN + ' selected';
  $('selbar').style.display = S.selN ? 'block' : 'none';
}
function selClear(){ S.sel = {}; selUpdate(); var e = document.querySelectorAll('.sel'), i; for(i=0;i<e.length;i++) e[i].className = e[i].className.replace(/\bsel\b/,'').replace(/\s+$/,''); }

/* ---------------- pieces ---------------- */
function albumCard(a, w, selMode){
  var k = key(a), sub = a.type==='album' ? a.year : (a.type==='ep' ? 'EP' : 'Single') + (a.year?' · '+a.year:'');
  var on = S.sel[a.url] ? ' sel' : '';
  return '<div class="card'+on+'" style="width:'+w+'px" data-act="'+(selMode?'togsel':'album')+'" data-k="'+k+'"><div class="cv" style="'+bg(a.art,300)+'"><div class="ov"></div>'+
    '<div class="ck">'+ic('check')+'</div>'+
    '<div class="hb l" data-act="dl" data-k="'+k+'" title="Download now">'+ic('download')+'</div>'+
    '<div class="hb r" data-act="add" data-k="'+k+'" title="Add to queue">'+ic('plus')+'</div></div>'+
    '<div class="t1">'+esc(a.name)+exb(a.ex)+'</div><div class="t2">'+esc(sub)+'</div></div>';
}
function acount(){ return Math.max(2, Math.floor((S.cw+20)/170)); }
/* artist search results have no picture from Apple: borrow the artist's latest album cover */
function artFix(list){
  each(list || [], function(a){
    if(a.art || a.artTry || !a.id) return; a.artTry = 1;
    http('https://itunes.apple.com/lookup?id='+a.id+'&entity=album&limit=4&country='+country(), function(d){
      var r = d && d.results, i; if(r) for(i=0;i<r.length;i++){ if(r[i].artworkUrl100){ a.art = r[i].artworkUrl100; break; } }
      if(a.art){ preImg(artw(a.art,300)); artPaint(a); }
    });
  });
}
function artPaint(a){
  var els = document.querySelectorAll('.acard'), i, f, sz;
  for(i=0;i<els.length;i++){
    if(S.reg[els[i].getAttribute('data-k')]!==a) continue;
    f = els[i].firstChild; sz = parseInt(els[i].style.width,10) || 150;
    if(f && !/background-image/.test(f.getAttribute('style')||''))
      f.outerHTML = '<div class="av" style="width:'+sz+'px;height:'+sz+'px;'+bg(a.art,300)+'"></div>';
  }
}
function artistCard(a, size, art){
  var k = key(a);
  var face = art ? '<div class="av" style="width:'+size+'px;height:'+size+'px;'+bg(art,300)+'"></div>' : avatar(a.name, size);
  return '<div class="acard" style="width:'+size+'px" data-act="artist" data-k="'+k+'">'+face+'<div class="t1">'+esc(a.name)+'</div></div>';
}
function songRow(s, opts){
  var k = key(s), on = S.sel[s.url] ? ' sel' : '';
  return '<div class="lr'+on+'" data-act="'+(opts&&opts.sel?'togsel':'songopen')+'" data-k="'+k+'"><div class="th" style="'+bg(s.art,100)+'"></div>'+
    '<div class="rt">'+esc(s.name)+exb(s.ex)+'</div><div class="rs">'+esc(s.album)+(s.year?' · '+esc(s.year):'')+'</div>'+
    '<div class="rv" data-act="pv" data-k="'+k+'" title="Preview">'+ic('play')+'</div>'+
    '<div class="ra" data-act="add" data-k="'+k+'" title="Add to queue">'+ic('plus')+'</div></div>';
}
function sortAlbums(list, mode){
  var a = list.slice(0);
  a.sort(function(x,y){
    if(mode===1) return x.date < y.date ? 1 : (x.date > y.date ? -1 : 0);
    if(mode===2) return x.date < y.date ? -1 : (x.date > y.date ? 1 : 0);
    if(mode===3) return x.name.toLowerCase() < y.name.toLowerCase() ? -1 : (x.name.toLowerCase() > y.name.toLowerCase() ? 1 : 0);
    return (y.tracks||0) - (x.tracks||0);
  });
  return a;
}

/* ---------------- navigation ---------------- */
var RAILP = {home:1, search:1, favs:1, queue:1, history:1, library:1, settings:1};
var animT = null;
function animOnce(){
  document.body.classList.remove('noanim');
  if(animT) clearTimeout(animT);
  animT = setTimeout(function(){ document.body.classList.add('noanim'); }, 1000);
}
function go(page, arg, keep){
  if(typeof L !== 'undefined' && L.open){ L.open = false; lyrRender(); }
  animOnce();
  if(!keep){ if(page==='album'){ if(!window.__pkq) sfx('in'); } else if(S.page==='album') sfx('out'); }
  if(!keep) S.stack.push({page:S.page, arg:S.arg, top:$('main').scrollTop, rail:S.rail});
  if(S.stack.length>40) S.stack.shift();
  if(!keep && page==='album' && window.__pkq && window.__pkRet && S.stack.length){ window.__pkRet.depth = S.stack.length; window.__pkRet.garg = S.stack[S.stack.length-1].arg; }
  S.page = page; S.arg = arg; if(RAILP[page]) S.rail = page;
  selClear();
  render(); $('main').scrollTop = 0;
}
function back(){
  var p = S.stack.pop(); if(!p) return;
  if(typeof L !== 'undefined' && L.open){ L.open = false; lyrRender(); }
  var pr = window.__pkRet, fromAlbum = (S.page==='album');
  if(S.page==='album' && p.page!=='album') sfx('out');
  animOnce();
  S.page = p.page; S.arg = p.arg; S.rail = p.rail; selClear(); render(); $('main').scrollTop = p.top||0;
  /* album was opened from the Xbox 360 picker: go back to the picker (same album selected), not the plain grid */
  if(pr && fromAlbum && p.page==='grid' && pr.depth && S.stack.length===pr.depth-1 && p.arg===pr.garg && window.__picker){
    window.__pkRet = null;
    setTimeout(function(){
      if(S.page!=='grid') return;
      var L = S.gridList || [], ix = pr.ix || 0, i;
      for(i=0;i<L.length;i++) if(L[i].id===pr.id){ ix = i; break; }
      window.__picker(L, S.arg, ix);
    }, 40);
  }
}
function render(){
  S.reg = {}; S.rn = 0; calc();
  document.body.className = (document.body.className.replace(/\b(dark)\b/,'').replace(/\s+/g,' ').replace(/^\s|\s$/g,'')) + (S.page==='artist' ? ' dark' : '');
  if(S.page!=='artist') hbgOff();
  var f = {home:rHome, search:rSearch, artist:rArtist, album:rAlbum, grid:rGrid, queue:rQueue, history:rHistory, favs:rFavs, library:rLibrary, settings:rSettings}[S.page];

function rHome(){
  var w = S.bigW, h = '<div class="pg"><div class="logo"><img src="'+LOGO+'" alt="gamdl desktop" draggable="false"></div>';
  var last = null, li;
  for(li=0; li<S.hist.length; li++){ if(S.hist[li].art && S.hist[li].url){ last = S.hist[li]; break; } }
  var pend = S.prog.pending || 0;
  h += '<h2 class="st plain">Top Picks for You</h2><div class="cards">';
  h += '<div class="big" style="width:'+w+'px;background:linear-gradient(160deg,#ff9a5a,#ff3d7f 60%,#b0208f)" data-act="nav" data-p="search"><div class="bi">'+ic('search')+'</div><div class="bl"><div class="b1">Start Here</div><div class="b2">Find Music</div><div class="b3">Search albums, songs and artists, or paste a link.</div></div></div>';
  h += '<div class="big" style="width:'+w+'px;background:linear-gradient(160deg,#4fa3ff,#5a4cff 60%,#2b1b86)" data-act="nav" data-p="queue"><div class="bi">'+ic('download')+'</div><div class="bl"><div class="b1">'+(S.prog.running?'Downloading Now':'Download Queue')+'</div><div class="b2">'+pend+' item'+(pend===1?'':'s')+' in queue</div><div class="b3">Up to '+S.cfg.parallel+' downloads at the same time.</div></div></div>';
  if(last) h += '<div class="big" style="width:'+w+'px;'+bg(last.art,400)+'" data-act="redo" data-k="'+key(last)+'" title="Download again"><div class="shade"></div><div class="bl"><div class="b1">Download Again</div><div class="b2">'+esc(last.name)+'</div><div class="b3">'+esc(last.artist)+'</div></div></div>';
  else h += '<div class="big" style="width:'+w+'px;background:linear-gradient(160deg,#35d0b9,#1b7f8f 60%,#12384d)" data-act="nav" data-p="history"><div class="bi">'+ic('clock')+'</div><div class="bl"><div class="b1">Recently Downloaded</div><div class="b2">History</div><div class="b3">Everything you have downloaded shows up here.</div></div></div>';
  h += '<div class="big" style="width:'+w+'px;background:#ececee" data-act="nav" data-p="favs"><div class="bi" style="color:#fa2d48"><svg class="ic f" viewBox="0 0 24 24" style="width:130px;height:130px;margin:0 auto">'+ICON.star+'</svg></div><div class="bl"><div class="b1" style="color:rgba(0,0,0,.5)">Made By You</div><div class="b2" style="color:#222">Favourite Artists</div><div class="b3" style="color:rgba(0,0,0,.65)">'+S.favs.length+' artist'+(S.favs.length===1?'':'s')+' you follow. Check them for new releases.</div></div></div>';
  h += '</div><div class="clr"></div>';
  if(S.hist.length){
    var seen = {}, list = [], i;
    for(i=0;i<S.hist.length && list.length<S.cols;i++){ var x=S.hist[i]; if(x.status!=='done' || seen[x.url]) continue; seen[x.url]=1; list.push(x); }
    if(list.length){
      h += '<h2 class="st" data-act="nav" data-p="history">Recently Downloaded <i>›</i></h2><div class="cards">';
      each(list, function(x){ var k = key(x);
        h += '<div class="card" style="width:'+S.W+'px" data-act="hopen" data-k="'+k+'"><div class="cv" style="'+bg(x.art,400)+'"><div class="ov"></div><div class="hb l" data-act="redo" data-k="'+k+'" title="Download again">'+ic('download')+'</div></div><div class="t1">'+esc(x.name)+'</div><div class="t2">'+esc(x.artist||x.kind)+'</div></div>'; });
      h += '</div><div class="clr"></div>';
    }
  }
  if(S.favs.length){
    h += '<h2 class="st" data-act="nav" data-p="favs">Favourite Artists <i>›</i></h2><div class="cards">';
    each(S.favs.slice(0, acount()), function(f){ h += artistCard({kind:'artist', id:f.id, name:f.name}, 150, f.art); });
    h += '</div><div class="clr"></div>';
  }
  setView(h + '</div>');
}

function recFeed(cc, kind, cb){
  var u = 'https://rss.applemarketingtools.com/api/v2/'+cc+'/music/most-played/25/'+kind+'.json';
  http(u, function(d){
    var f = d && d.feed && d.feed.results;
    if((!f || !f.length) && cc!=='us') return recFeed('us', kind, cb);
    cb(f || []);
  });
}
function recLookup(list, wrap, cc, cb){
  var ids = [], i; for(i=0;i<list.length && ids.length<12;i++) if(list[i].id) ids.push(list[i].id);
  if(!ids.length) return cb([]);
  http('https://itunes.apple.com/lookup?id='+ids.join(',')+'&country='+cc, function(d){ cb(parse(d, wrap)); });
}

function preImg(u){
  if(!u || window.__preImg[u]) return;
  var im = new Image(); im.crossOrigin = 'anonymous'; im.decoding = 'async'; im.src = u;
  window.__preImg[u] = im; PRE.push(u);
  if(PRE.length > 400){ delete window.__preImg[PRE.shift()]; }
}

var ABGC = {};
function abgFill(url){
  var els = document.querySelectorAll('.abg i'); if(!els.length || !url) return;
  function apply(c){
    for(var i=0;i<els.length;i++){ var k=c[i%c.length];
      els[i].style.backgroundImage='radial-gradient(closest-side,rgba('+k+',1) 0%,rgba('+k+',.55) 45%,rgba('+k+',0) 100%)'; }
  }
  function fb(){ for(var i=0;i<els.length;i++){ els[i].style.backgroundImage=cssurl(artw(url,60)); } }
  if(ABGC[url]) return apply(ABGC[url]);
  var im = new Image(); im.crossOrigin = 'anonymous';
  im.onload = function(){
    try{
      var cv = document.createElement('canvas'); cv.width = cv.height = 6;
      var cx = cv.getContext('2d'); cx.drawImage(im,0,0,6,6);
      var d = cx.getImageData(0,0,6,6).data, px = [], i;
      for(i=0;i<d.length;i+=4){
        var r=d[i],g=d[i+1],b=d[i+2], mx=Math.max(r,g,b), mn=Math.min(r,g,b), sat=mx?(mx-mn)/mx:0;
        px.push({c:[r,g,b], sc:sat*1.4+mx/255*0.6});
      }
      px.sort(function(a,b){return b.sc-a.sc;});
      var out=[], j;
      for(i=0;i<px.length && out.length<3;i++){
        var c=px[i].c, ok=true;
        for(j=0;j<out.length;j++){ var o=out[j]; if(Math.abs(o[0]-c[0])+Math.abs(o[1]-c[1])+Math.abs(o[2]-c[2])<70){ok=false;break;} }
        if(ok) out.push(c);
      }
      while(out.length<3) out.push(px[out.length%px.length].c);
      out = out.map(function(c){ // boost saturation a bit

/* ---------------- top bar + rail ---------------- */
function overall(){ var it = S.prog.items, i, s = 0; if(!it.length) return 0; for(i=0;i<it.length;i++) s += it[i].pct||0; return Math.round(s/it.length); }
/* ---------------- song preview player (30 s clips from Apple) ---------------- */
var P2 = {list:[], i:-1, audio:null, playing:false, shuffle:false, repeat:false, cur:null};
/* full songs: the engine plays them with mpv (yt-dlp finds them on YouTube Music); the page only keeps a clock for the bar.
   shortcut: no EQ or synced lyrics for mpv songs, the clock drifts if mpv stalls - ask the engine for time-pos to fix */
var MP = {on:false, loading:false, t:0, t0:0, tk:0};   /* loading = mpv is still finding/buffering the song */
/* MP.os = engine clock minus page clock. Every sample reaches us a little late, so the biggest recent offset is the freshest one */
function mpTime(){
  if(MP.loading) return 0;
  if(P2.playing && MP.os != null) return Date.now() / 1000 + MP.os;
  return MP.t + (P2.playing ? (Date.now() - MP.t0) / 1000 : 0);
}
function mpReset(){ MP.os = null; MP.sm = []; }
/* mpv could not play this song: skip to the next one so a single missing song does not stop the album; give up after 3 failures in a row */
function mpFail(){
  P2.fails = (P2.fails || 0) + 1;
  if(P2.fails < 3 && pvNextIdx() >= 0){ toast('Could not play "' + (P2.cur ? P2.cur.name : 'this song') + '" - skipping it'); pvStep(1); return; }
  P2.fails = 0; toast('Could not play the full song - check that mpv and yt-dlp work'); pvStop();
}
function pvTime(){ return MP.on ? mpTime() : (P2.audio ? P2.audio.currentTime : 0); }   /* one clock for the lyrics: mpv songs have no audio element */
function mpStop(){ if(!MP.on) return; MP.on = MP.loading = false; clearInterval(MP.tk); send('mpvstop'); }
/* clean mode: an explicit song (E) is searched with "clean" added, so YouTube Music lists its non-explicit version first
   shortcut: a keyword, not a guarantee - YouTube Music may still return the explicit one; check "title=" in gamdl_mpv.log */
function mpUrl(s){ return 'https://music.youtube.com/search?q=' + encodeURIComponent(s.artist + ' ' + s.name + (S.cfg.clean && s.ex ? ' clean' : '')) + (s.time ? '&d=' + Math.round(s.time / 1000) : '') + '#songs'; }   /* &d = the real length: the engine picks the result closest to it, not just the first */
/* the song after this one is downloaded while this one plays (engine: yt-dlp, through aria2c when installed), so it starts from disk with no wait */
function mpAhead(){ var j = pvNextIdx(), nx = j >= 0 ? P2.list[j] : null; if(nx && !nx.local) send('mpvpre', mpUrl(nx)); }
function mpPlay(s){
  var a = P2.audio; if(a){ P2.audio = null; try{ a.pause(); }catch(e){} }   /* detached first, so its pause event is ignored */
  MP.on = MP.loading = true; MP.t = 0; MP.t0 = Date.now(); mpReset(); clearInterval(MP.tk); MP.tk = setInterval(updateTop, 1000);
  send('mpveq', eqAf());   /* the engine starts mpv with the current EQ */
  send('mpv', mpUrl(s), S.muted ? 0 : curVol());
  P2.playing = true; updateTop(); markPlaying();
}
function pvBind(a){
  if(a._b) return a; a._b = 1;
  a.addEventListener('ended', function(){ if(P2.audio===a) pvStep(1); }, false);
  a.addEventListener('timeupdate', function(){ if(P2.audio===a) updateTop(); }, false);
  a.addEventListener('playing', function(){ if(P2.audio===a){ if(!P2.hdk || a.volume > 0.02) P2.hdk = false; P2.playing = true; try{ eqAttach(a); }catch(x){} updateTop(); try{ libMark(); }catch(x){} } }, false);
  a.addEventListener('loadedmetadata', function(){ if(P2.audio===a && P2.cur && P2.cur.local && !P2.cur.time && isFinite(a.duration)) P2.cur.time = Math.round(a.duration*1000); }, false);
  a.addEventListener('pause', function(){ if(P2.audio===a){ P2.playing = false; updateTop(); try{ libMark(); }catch(x){} } }, false);
  a.addEventListener('error', function(){
    if(P2.audio!==a || !P2.cur) return;
    /* the CDN refused CORS: play without the equalizer instead of failing */
    if(!P2.cur.local && a.crossOrigin && !a._nocors){
      a._nocors = 1; PVN.nocors = true;
      if(a._eqsrc){ var n = pvBind(document.createElement('audio')), u = a.src; n._nocors = 1; P2.audio = n; applyVol(); try{ a.pause(); a.removeAttribute('src'); a.load(); }catch(e){} n.src = u; pvTry(n); return; }
      try{ var u2 = a.src; a.removeAttribute('crossorigin'); a.src = u2; a.load(); }catch(e){}
      pvTry(a); return;
    }
    toast(P2.cur.local ? 'This file could not be played' : 'This preview could not be played'); pvStop();
  }, false);
  return a;
}
function pvAudio(){
  if(!P2.audio){ var na = document.createElement('audio'); if(!PVN.nocors) na.crossOrigin = 'anonymous'; P2.audio = pvBind(na); applyVol(); }
  return P2.audio;
}
/* warm pool: previews are downloaded in the background before you press play */
var PVW = {}, PVO = [], PVN = {nocors:false};
function pvWarm(u){
  if(!u || PVW[u] || !window.Audio) return;
  if(P2.audio && P2.audio.src===u) return;
  try{
    var a = new Audio(); a.preload = 'auto'; if(!PVN.nocors) a.crossOrigin = 'anonymous'; a.src = u; PVW[u] = a; PVO.push(u);
    while(PVO.length > 8){ var o = PVO.shift(), x = PVW[o]; delete PVW[o]; try{ x.removeAttribute('src'); x.load(); }catch(e){} }
  }catch(e){}
}
function pvWarmList(l, n){ var i, c = 0; for(i=0;l && i<l.length && c<n;i++) if(l[i] && l[i].preview){ pvWarm(l[i].preview); c++; } }
function pvTake(u){
  var a = PVW[u]; if(!a) return null;
  if(a.error){ delete PVW[u]; var k0 = PVO.indexOf(u); if(k0 >= 0) PVO.splice(k0,1); return null; }
  delete PVW[u]; var k = PVO.indexOf(u); if(k>=0) PVO.splice(k,1);
  var old = P2.audio; if(old && old!==a){ try{ old.pause(); }catch(e){} }
  P2.audio = pvBind(a); applyVol(); try{ a.currentTime = 0; }catch(e){}
  return a;
}

/* warm the preview the moment the pointer reaches a song row */
var pvLast = null;
document.addEventListener('mouseover', function(e){
  var t = e.target, r = t && t.closest ? t.closest('.lr, .tr') : null;
  if(!r || r===pvLast) return; pvLast = r;
  var it = S.reg[r.getAttribute('data-k')]; if(it && it.kind==='song' && it.preview) pvWarm(it.preview);
}, true);
function pvTry(a){ try{ var r = a.play(); if(r && r.catch) r.catch(function(){}); }catch(e){} }
function ctxList(){
  var p = S.page;
  if(p==='album' && S.alb && S.alb.tracks) return S.alb.tracks;
  if(p==='artist' && S.art && S.art.songs) return S.art.songs;
  if(p==='search' && S.res) return S.res.songs.slice(0,12);
  if(p==='search' && S.rec && S.rec.songs) return S.rec.songs.slice(0,10);   /* the "Recommended Songs" list shown before you search: without this a click played one song and stopped */
  return [];
}
function firstPv(l){ var j; for(j=0;j<l.length;j++) if(l[j].preview) return j; return -1; }
function pvLoad(i){
  P2.hdk = false;
  var s = P2.list[i]; P2.i = i; P2.cur = s;
  if(!s.local){ mpPlay(s); mpAhead(); if(L.open) lyrFetch(s); else lyrWarm(s); return; }
  mpStop();
  var a = pvTake(s.preview), warm = !!a;
  if(!a) a = pvAudio();
  if(!warm && a._eqsrc && !a.crossOrigin && !s.local){ var na2 = document.createElement('audio'); P2.audio = a = pvBind(na2); if(!PVN.nocors) na2.crossOrigin = 'anonymous'; applyVol(); }
  if(!warm){ try{ a.src = s.preview; a.load(); }catch(e){} }
  pvTry(a); P2.playing = true; updateTop(); markPlaying();
  var nx = P2.list[i+1]; if(nx) pvWarm(nx.preview);
  if(L.open) lyrFetch(s); else lyrWarm(s);
}
function pvPlay(list, i){
  var l = [], idx = -1, j;
  for(j=0;j<list.length;j++){ if(list[j].preview){ if(j===i) idx = l.length; l.push(list[j]); } }
  if(idx < 0){ toast('No preview available for this song'); return; }
  P2.list = l; pvLoad(idx);
}
function pvStop(){
  P2.hdk = false; mpStop();
  var a = P2.audio; if(a){ try{ a.pause(); }catch(e){} }
  P2.cur = null; P2.playing = false; if(L.open){ L.id = null; lyrRender(); } updateTop(); markPlaying();
}
function pvToggle(){
  if(MP.on){ MP.t = mpTime(); P2.playing = !P2.playing; MP.t0 = Date.now(); mpReset(); send('mpvpause', P2.playing ? 0 : 1); updateTop(); markPlaying(); return; }
  var a = P2.audio;
  if(P2.cur && a){ if(a.paused) pvTry(a); else a.pause(); return; }
  var l = ctxList(), f = firstPv(l);
  if(f < 0){ toast('Open a song or album to preview it'); return; }
  pvPlay(l, f);
}
/* index of the song that follows the current one; shuffle picks it once and pvStep then follows that pick */
function pvNextIdx(){
  var n = P2.list.length, i = P2.i;
  if(P2.shuffle && n > 1){ if(P2.nxi == null || P2.nxi === i || P2.nxi >= n){ do{ P2.nxi = Math.floor(Math.random()*n); }while(P2.nxi === i); } return P2.nxi; }
  i++; return i < n ? i : (P2.repeat && n > 1 ? 0 : -1);
}
function pvStep(dir){
  if(!P2.list.length){ pvToggle(); return; }
  var n = P2.list.length, i = P2.i;
  if(P2.shuffle && n > 1){ if(dir > 0 && P2.nxi != null && P2.nxi !== P2.i && P2.nxi < n) i = P2.nxi; else { do{ i = Math.floor(Math.random()*n); }while(i === P2.i); } P2.nxi = null; }
  else { i += dir; if(i >= n || i < 0){ if(P2.repeat || dir < 0) i = (i+n)%n; else { pvStop(); return; } } }
  pvLoad(i);
}
function pvPrev(){ var a = P2.audio; if(a && P2.cur && a.currentTime > 3){ try{ a.currentTime = 0; }catch(e){} return; } pvStep(-1); }
function markPlaying(){ try{ libMark(); }catch(x){}
  var c = P2.cur, e = document.querySelectorAll('#view .tr, #view .lr'), i, it, on, has;
  for(i=0;i<e.length;i++){
    it = S.reg[e[i].getAttribute('data-k')]; on = !!(c && it && it.kind==='song' && it.id===c.id);
    has = /\bpl\b/.test(e[i].className);
    if(on && !has) e[i].className += ' pl'; else if(!on && has) e[i].className = e[i].className.replace(/\s*\bpl\b/,'');
  }
}

/* ---------------- volume ---------------- */
var vdrag = false;
function inside(el, node){ while(el){ if(el === node) return true; el = el.parentNode; } return false; }
function curVol(){ var v = S.cfg.volume; return (v == null || isNaN(v)) ? 80 : v; }
function volOff(){ return S.muted || curVol() === 0; }
function applyVol(){
  if(MP.on){ clearTimeout(MP.vt); MP.vt = setTimeout(function(){ if(MP.on) send('mpvvol', S.muted ? 0 : curVol()); }, 120); }   /* a drag makes dozens of values: send the last one */

}

function setVol(v, commit){

function gxDur(s){ s = Math.round(s); if(s < 60) return s + ' s'; var m = Math.round(s / 60); if(m < 60) return m + ' min'; var h = Math.floor(m / 60); m = m % 60; return h + ' h' + (m ? ' ' + m + ' min' : ''); }

function gxKey(it){

var gxAddMany = addMany;

    if(x.status === 'done' || x.status === 'failed'){ s += 1; fin++; }
    else { p = x.total ? (x.done || 0) / x.total : 0; if((x.pct || 0) / 100 > p) p = (x.pct || 0) / 100; s += Math.max(0, Math.min(0.99, p)); }
